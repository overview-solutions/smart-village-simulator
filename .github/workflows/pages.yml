# Deploy 404s until Settings → Pages → Source = GitHub Actions.
# build (npm test + vite) is the required job. deploy is follow-on.
name: pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Circaevum/locus
          ref: 069a6a42c8bedc0ca0cdd82fa9b5198e3cdfb7a0
          path: _locus
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Point Locus at the checked-out sibling
        run: npm pkg set dependencies.@circaevum/locus="file:./_locus"
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Missing Pages setting → deploy-pages 404. Do not fail the workflow.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages must use GitHub Actions source
        run: |
          echo "Deploy 404 = Pages not enabled or Source is not GitHub Actions."
          echo "Click: https://github.com/${{ github.repository }}/settings/pages"
          echo "Set Source to GitHub Actions. Org policy can also block Pages."
      - id: deployment
        uses: actions/deploy-pages@v4
