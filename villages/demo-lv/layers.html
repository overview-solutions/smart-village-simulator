  junctions:"#9b7bde", devices:"#e07a5f", connectivity:"#7aa2b8", feeds:"#f2cc8f"
};
const islandPlant = new Set(["gen","station","bess","inverter"]);
const on = Object.fromEntries([...document.querySelectorAll("[data-layer]")].map(el => [el.dataset.layer, el.checked]));
const svg = document.getElementById("map");
const detail = document.getElementById("detail");
const points = new Map();
for (const layer of ["structure","devices","junctions"]) {
  for (const f of PACK[layer]) {
    const x = f.properties.x ?? f.geometry.coordinates[0];
    const z = f.properties.z ?? f.geometry.coordinates[1];
    points.set(f.properties.id, {x,z, props:f.properties, layer});
  }
}
const feedById = new Map(PACK.feeds.bindings.map(b => [b.assetId, b]));
let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
for (const p of points.values()){ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minZ=Math.min(minZ,p.z); maxZ=Math.max(maxZ,p.z); }
for (const sn of PACK.subnetworks) for (const [x,z] of sn.geometry.coordinates[0]) {
  minX=Math.min(minX,x); maxX=Math.max(maxX,x); minZ=Math.min(minZ,z); maxZ=Math.max(maxZ,z);
}
const pad=4; minX-=pad; maxX+=pad; minZ-=pad; maxZ+=pad;
const W=720,H=480;
const sx = x => ((x-minX)/(maxX-minX))*(W-24)+12;
const sy = z => ((z-minZ)/(maxZ-minZ))*(H-24)+12;

document.getElementById("legend").innerHTML = Object.entries(COLORS).map(([k,c]) =>
  `<span><i class="sw" style="background:${c}"></i>${k}</span>`).join("");

function snOk(sn, ac){
  const feeder = document.getElementById("feeder").value;
  if (feeder==="all") return true;
  if (sn===feeder) return true;
  if (sn==="island-1" && ac && islandPlant.has(ac)) return true;
  return false;
}

function draw(){
  const lod = document.getElementById("lod").value;
  const feeder = document.getElementById("feeder").value;
  const ns = "http://www.w3.org/2000/svg";
  svg.innerHTML = "";
  const add = (tag, attrs) => { const el=document.createElementNS(ns,tag); for (const [k,v] of Object.entries(attrs)) el.setAttribute(k,v); svg.appendChild(el); return el; };

  if (on.subnetworks && +lod>=1) {
    for (const sn of PACK.subnetworks) {
      if (feeder!=="all" && sn.id!==feeder) continue;
      const ring = sn.geometry.coordinates[0];
      const d = ring.map((c,i)=>`${i?"L":"M"}${sx(c[0])},${sy(c[1])}`).join(" ")+" Z";
      add("path", {d, fill:COLORS.subnetworks, "fill-opacity":"0.12", stroke:COLORS.subnetworks, "stroke-width":"1.5",
        "stroke-dasharray": sn.properties.assetClass==="island"?"6 4":""});
    }
  }
  if (on.lines && +lod>=1) {
    for (const ln of PACK.lines) {
      if (lod==="1" && ln.properties.assetClass!=="trunk") continue;
      if (!snOk(ln.properties.subnetworkId)) continue;
      const d = ln.geometry.coordinates.map((c,i)=>`${i?"L":"M"}${sx(c[0])},${sy(c[1])}`).join(" ");
      const w = ({trunk:3,primary:2.2,secondary:1.6}[ln.properties.assetClass])||1.2;
      add("path", {d, fill:"none", stroke:COLORS.lines, "stroke-width":String(w)});
    }
  }
  if (on.connectivity && +lod>=2) {
    for (const e of PACK.associations.connectivity) {
      if (!snOk(e.subnetworkId)) continue;
      const a=points.get(e.fromId), b=points.get(e.toId); if(!a||!b) continue;
      add("line", {x1:sx(a.x), y1:sy(a.z), x2:sx(b.x), y2:sy(b.z), stroke:COLORS.connectivity, "stroke-width":"1", "stroke-dasharray":"3 3", opacity:"0.8"});
    }
  }
  if (on.structure && +lod>=2) {
    for (const f of PACK.structure) {
      if (!snOk(f.properties.subnetworkId)) continue;
      const x=sx(f.properties.x), z=sy(f.properties.z);
      const r=add("rect", {x:x-5, y:z-5, width:10, height:10, fill:"none", stroke:COLORS.structure, "stroke-width":"1.5"});
      r.setAttribute("transform", `rotate(45 ${x} ${z})`);
    }
  }
  if (on.junctions && +lod>=2) {
    for (const f of PACK.junctions) {
      if (!snOk(f.properties.subnetworkId)) continue;
      add("circle", {cx:sx(f.properties.x), cy:sy(f.properties.z), r:4, fill:"#0b1015", stroke:COLORS.junctions, "stroke-width":"1.5"});
    }
  }
  if (on.devices && +lod>=1) {
    for (const f of PACK.devices) {
      const ac=f.properties.assetClass, sn=f.properties.subnetworkId;
      if (lod==="1" && !islandPlant.has(ac)) continue;
      if (lod==="2" && ac==="meter") continue;
      if (!snOk(sn, ac)) continue;
      const cx=sx(f.properties.x), cy=sy(f.properties.z);
      let mark;
      if (ac==="meter") mark=add("rect",{x:cx-6,y:cy-6,width:12,height:12,rx:2,fill:"#0b1015",stroke:COLORS.devices,"stroke-width":"1.5"});
      else if (islandPlant.has(ac) && ac!=="station") mark=add("path",{d:`M ${cx} ${cy-8} L ${cx+8} ${cy} L ${cx} ${cy+8} L ${cx-8} ${cy} Z`,fill:"#0b1015",stroke:COLORS.devices,"stroke-width":"1.5"});
      else mark=add("circle",{cx,cy,r:ac==="station"?8:6,fill:"#0b1015",stroke:COLORS.devices,"stroke-width":"1.5"});
      const binding=feedById.get(f.properties.id);
      if (on.feeds && binding && +lod >= (binding.lod||3)) add("circle",{cx:cx+7,cy:cy-7,r:3,fill:COLORS.feeds});
      const hit=add("circle",{cx,cy,r:14,fill:"transparent", style:"cursor:pointer"});
      hit.addEventListener("click", () => {
        detail.textContent = JSON.stringify({asset:f.properties, feed:binding||null}, null, 2);
      });
    }
  }
  if (lod==="0") {
    add("circle",{cx:sx(-22),cy:sy(-8),r:8,fill:COLORS.subnetworks});
    const t=add("text",{x:sx(-22),y:sy(-8)-14,"text-anchor":"middle",fill:"#e7ecf1","font-size":"11"});
    t.textContent="demo-lv";
  }
}
for (const el of document.querySelectorAll("[data-layer]")) el.addEventListener("change", e => { on[e.target.dataset.layer]=e.target.checked; draw(); });
document.getElementById("lod").addEventListener("change", draw);
document.getElementById("feeder").addEventListener("change", draw);
draw();
</script>
</body>
</html>
